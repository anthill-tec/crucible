# Crucible CLIENT limits — the file you edit, and the file the fleet ships.
#
# CR-CRU-131 §S1c. A limit is CONFIGURATION, never a constant compiled into
# source (PRD §4.13), and the last resort is a DATA FILE in the distribution
# rather than a number in a resolver. This file is that data: it ships inside
# `crucible-axi` beside `_crucible_axi.py`, the module that reads it, and the
# installer lays a copy down at the target directory for you to edit.
#
# ── How to change a limit ──────────────────────────────────────────────────
#
# Add a `value = …` line to the limit's table. Do NOT edit `description`,
# `recommended`, `min` or `max`: those four are DOCUMENTATION — the record of
# what we ship and stand behind — and overwriting `recommended` in place
# destroys, in the very file you are reading, the means of telling our number
# from yours after the next upgrade.
#
#     [limits.<name>]
#     …the four documented fields, untouched…
#     value = 40          # <- yours, beside ours
#
# With no `value`, a limit runs at its `recommended`. With one, it runs at
# `value`, range-checked against the `min`/`max` beside it. A `value` outside
# that range is REFUSED — never clamped — and disclosed, naming the limit,
# your value, the range and the recommendation; the limit then runs at
# `recommended` until the file is corrected. Read at the POINT OF USE: an edit
# takes effect on the next call and nothing needs restarting.
#
# A client reads the `crucible.toml` in the PROJECT DIRECTORY it is working in,
# beside the `.env` the clients already read; the installed copy is the fleet's
# last resort when a project declares nothing.
#
# ── Why only the CLIENT's three limits are here ────────────────────────────
#
# A limit is owned by the process that ENFORCES it, and the two sides are
# separate packages, installable on different hosts at independently resolved
# versions. The SERVER's limits are read from the `crucible.toml` beside its
# own DATABASE and ship in its own distribution. No client reads that file and
# the server never reads this one, so a server limit written here would be
# inert: documentation must not teach a knob that provably does nothing where
# it sits.
#
# ── Two settings that are NOT here, and cannot be ─────────────────────────
#
# CR-CRU-139 §S3. A reader who has just found `[client] url` below is owed the
# boundary, or the next change "finishes the job" by moving a value that
# precedes this file's own discovery.
#
# `CRUCIBLE_PROJECT_KEY` stays in the environment because it is IDENTITY
# rather than configuration: a client reads it from the project `.env` beside
# this file to learn which project a run belongs to, and it is answered before
# there is a resolved project directory whose file could carry it.
#
# `CRUCIBLE_DB` stays in the environment for the same class of reason on the
# other side of the fence, and is named here only to complete the boundary: it
# is the path at which the SERVER finds its own `crucible.toml`, so it
# necessarily precedes the reading of any such file. No client reads it.

[limits.truncate_field_chars]
description = "Visible characters of a long text field before the envelope cuts it and appends a size hint naming the true length; `--full` defeats it per call."
recommended = 200
# A width of 0 shows nothing at all, so the floor is more than "positive": 20
# characters is the least that can carry a recognisable fragment of an error
# before the hint.
min = 20
# Past a few thousand characters a "field" is a document, and the reader's
# context is what these limits exist to protect.
max = 4000

[limits.error_detail_chars]
description = "Maximum characters of the warning detail reported for a run that produced NO report, so a starved runner's output cannot flood the envelope carrying its cause."
recommended = 500
# The composed PREFIX is never truncated, so a floor beneath its own length
# would be a bound the envelope could not honour; 100 leaves the prefix intact
# plus room for a fragment of the cause.
min = 100
# 20k is past the point where a machine caller is reading a detail rather than
# the runner's own stream.
max = 20000

[limits.roadmap_list_rows]
description = "Rows of a roadmap list emitted before it is truncated; `totalCount` always reports the TRUE total and `--full` emits the list whole."
recommended = 20
# Fewer than a handful of rows is a list that cannot show a wave.
min = 5
# 500 rows is four times the largest board this fleet has carried.
max = 500

# ── The gate steps a project NEVER runs ────────────────────────────────────
#
# §S1. `gate-run` hands `no-mistakes axi run` a `--skip` list, and a step a
# project must never run — `pr` and `ci` open a GitHub pull request, which a
# git-flow project merging directly has no use for — used to be a flag every
# caller had to remember on every call. Forgetting it once repeated the
# mistake. It is a DECLARATION here instead, resolved through the same chain
# and at the same POINT OF USE as the limits above and the board below: the
# PROJECT's own `crucible.toml` first, then the installed copy.
#
#     [gate]
#     skip = ["pr", "ci"]  # <- passed as `--skip pr,ci` on every gate-run
#
# An explicit `--skip` on the command line REPLACES the declared list for that
# one call, and `--skip ""` skips nothing. The envelope's `skip` and
# `skipSource` (`flag`, `declared:<file>` or `none`) say which list a run used
# and where it came from.
#
# The step NAMES are no-mistakes' own, never this file's: they pass through
# unvalidated, and no-mistakes refuses one it does not know itself. Only the
# SHAPE is checked here — a list of non-empty strings, one step per entry, no
# commas — and a malformed declaration is REFUSED, naming this file, before
# no-mistakes is launched: a skip list cannot degrade to a safe value, because
# running the steps a project declared it never runs is the very mistake the
# declaration exists to prevent.

[gate]
# The shipped install declares NO skip, so a project that declares nothing
# runs every step, exactly as before this table existed.
# A project file declaring nothing here still wins; the install's is not read.

# ── The directory a bun project's package lives in ────────────────────────
#
# The bun client runs `bun test`, `tsc` and a project's declared scripts in the
# project's bun PACKAGE DIR. A project whose package is not at its root
# declares where it is, in its OWN `crucible.toml`:
#
#     [bun]
#     package_dir = "packages/app"  # <- relative to the project root
#
# The order is `--package-dir`, then `$BUN_CRUCIBLE_PACKAGE_DIR`, then this
# declaration, then the project root, and a relative value from any of the
# three resolves against the project root. A declared value that is not a
# directory holding a `package.json` is REFUSED, naming this file, before
# anything is posted to the board.
#
# Read from the PROJECT's file only, never the installed copy: an install-wide
# package dir would make one project every other project's default.

[bun]
# The shipped file declares NO package_dir, so a project that declares nothing
# runs from its own root.

# ── The runner a python project's tests run under ─────────────────────────
#
# The python client runs a project's tests under `unittest` unless the project
# declares otherwise, in its OWN `crucible.toml`:
#
#     [python]
#     runner = "pytest"  # <- or "unittest", the default
#
# `--runner <name>` on a running verb (`test`, `regression`, a tier verb,
# `pre-merge-gate`) overrides the declaration for that one call. A value that
# is neither name is REFUSED, naming its source, and so is `pytest` with an
# interpreter that cannot import it: both before anything is posted to the
# board. A project file that is absent or does not parse declares nothing.
#
# Read from the PROJECT's file only, never the installed copy: an install-wide
# runner would make one project every other project's default.

[python]
# The shipped file declares NO runner, so a project that declares nothing runs
# under unittest, exactly as before this table existed.

# ── The runs a rust project declares: [targets.<profile>] ─────────────────
#
# A rust project declares its runs in its OWN `crucible.toml`, one table per
# nextest profile, in the one vocabulary every stack uses (bun's
# `crucible.targets` in `package.json` is the same vocabulary, keyed by
# script). The fields:
#
#   framework  the runner the run states            (rust: "nextest")
#   stream     the run's record: its `codec`, and the `path` it is read from;
#              `path = "stdout"` means the runner's own stdout
#
# The rust entry, the only one a rust run takes:
#
#     [targets.ci]
#     framework = "nextest"
#     stream = { codec = "nextest", path = "stdout" }
#
# A profile with no entry, or a project with no `crucible.toml`, is undeclared
# and runs exactly as if it declared that entry: it streams by default. An
# entry naming another `framework`, `codec` or `path`, or declaring `junit`,
# `console` or `coverage` (a rust run's record is its stream, and its coverage
# follows the verb), is REFUSED before anything runs, naming the table and the
# field. A project file that does not parse is refused too.
#
# Read from the PROJECT's own file only, never the installed copy: an install
# entry would make one project every other project's declaration.
#
# The standard rust profiles a scaffold sets up in `.config/nextest.toml`:
#
#   default  every test but the docker tier (`default-filter = "not
#            binary(<docker e2e binary>)"`) - a developer's run
#   ci       the same selection, the docker-free gate's profile (`test`,
#            `regression`, `pre-merge-gate`)
#   e2e      the docker tier alone (`default-filter = "binary(<docker e2e
#            binary>)"`), run by `docker-e2e-gate` with docker up
#
# A run streams through cargo-nextest 0.9.130 or later.
#
# An arduino run keys its entry by native dir and make target: the native dir
# (`--dir`, relative to the project dir) joined by `/` to the make target. The
# arduino entry, which turns a native target's stream on:
#
#     [targets."tests/native/junit"]
#     framework = "arduino-native"
#     stream = { codec = "crucible-events", path = "env:CRUCIBLE_STREAM" }
#
# Every field is required. A native dir and make target with no entry runs as
# before, filed from its JUnit. An entry under the run's key naming another
# `framework`, `codec` or `path`, or declaring `junit`, `console` or
# `coverage`, is REFUSED before anything runs; another stack's entry is
# skipped. The harness writes the stream under the `CRUCIBLE_STREAM` make
# contract (`arduino-crucible.py --help`).
#
# A maven run keys its entry by tier: `unit`, `module`, `integration`, `e2e`,
# `bdd` or `regression` (`test` reads `unit`, `pre-merge-gate` reads
# `regression`). The maven entry, which declares a tier's console:
#
#     [targets.<tier>]
#     framework = "surefire"
#     console = "surefire-console"
#
# Both fields are required. A tier with no entry runs as before. An entry
# under the run's key naming another `framework` or `console`, or declaring
# `junit`, `stream` or `coverage`, is REFUSED before anything runs, as is a
# declared run on a board whose health lists no `surefire-console` under
# `codecs.view`; another stack's entry is skipped.

# ── The linter a project runs: [lint] ───────────────────────────────────
#
# Every client's `lint` verb, and the `pre-merge-gate` lint stage, run the
# linter a project declares in its OWN `crucible.toml`:
#
#     [lint]
#     command = ["ruff", "check", "--output-format", "concise", "."]
#     format = "ruff"      # <- the board's decoder for the output; optional
#     name = "ruff"        # <- the linter's name on the board; optional
#
# `command` is a non-empty list of non-empty strings, run in the project dir
# (bun: its package dir). A first word holding no `/` is looked up on PATH; one
# holding a `/` (`.venv/bin/ruff`) resolves against that directory. The
# record's `lint` marker is `name`, else `format`, else the basename of the
# command's first word (`ruff` for `.venv/bin/ruff`). The linter's exit is the
# verdict. A malformed table is REFUSED, naming this file, before anything runs.
#
# The table resolves as `[gate]` does: the PROJECT's own file first, then the
# installed copy, the first file that parses winning. A project file without
# `[lint]` hides the install's; a project with no file of its own inherits an
# install-wide `[lint]`, whatever its stack, and it replaces that stack's
# default.
#
# The defaults, when nothing is declared: rust runs `cargo clippy --workspace
# --all-targets --all-features -- -D warnings` (format `clippy`, with
# CARGO_BUILD_JOBS); go runs `go vet ./...` in each module (format `go vet`).
# python, bun, maven and arduino have none: their `lint` answers
# `skipped: not-declared`, and their gate goes on with a `lint-not-declared`
# warning. A declared `command` replaces the default.
#
# The shipped install declares NO [lint] table: nothing is declared here.

# ── The BOARD this fleet posts to ──────────────────────────────────────────
#
# CR-CRU-139 §S2. A connection is configuration too. The board a client posts
# to used to be `$CRUCIBLE_URL`, bound at import into five separate module
# constants, so "point this checkout at another board" meant an export every
# shell and every sub-agent had to remember — and forgetting was silent: the
# run simply landed on the default, which on a machine carrying a production
# instance is the production board. It is a DECLARATION here instead, resolved
# at the same POINT OF USE as the limits above but BY TABLE: the first file that
# declares a non-empty `url` wins — the PROJECT's own `crucible.toml`, then the
# installed copy — a file without one is passed over, and this shipped data is
# the last resort. Nothing to export, and a per-project answer that survives
# every verb and every sub-agent.

[client]
# The board every verb of every client posts to. The shipped value is the
# address this fleet has always defaulted to, so an install that declares
# nothing reports exactly where it did before. An operator running a second
# instance beside a production one declares that instance's address in the
# project's own file — `url = "http://localhost:3850"` — and every client in
# that project follows, with nothing exported.
# A project file declaring no `url` here is passed over for the install's.
url = "http://localhost:3849"

