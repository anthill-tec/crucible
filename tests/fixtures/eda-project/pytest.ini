# A real eda project the eda client's tests run from a SCRATCH COPY, never in
# place. Its test files are named `check_*.py`, which neither this repo's
# python discovery (`test_*.py`, `test*.py`) nor `bun test` collects; this file
# is what tells pytest to collect them, and it makes this directory pytest's
# rootdir, so a node id reads `tests/unit/check_board.py::<test>`.
[pytest]
python_files = check_*.py
