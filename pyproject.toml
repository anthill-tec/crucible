[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "crucible-axi"
dynamic = ["version"]
description = "Crucible install orchestrator — ships the *-crucible.py client fleet and stages server/manifest sub-installers behind one TOON-AXI envelope"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-only"
dependencies = []
authors = [{ name = "Antony John" }]
keywords = ["crucible", "axi", "orchestration", "model-b", "testing"]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Operating System :: POSIX",
]

[project.urls]
Homepage = "https://github.com/anthill-tec/crucible"
Source = "https://github.com/anthill-tec/crucible"
Changelog = "https://github.com/anthill-tec/crucible/blob/master/CHANGELOG.md"
"Release Notes" = "https://github.com/anthill-tec/crucible/releases"
Issues = "https://github.com/anthill-tec/crucible/issues"

[project.optional-dependencies]
# The toolchain `python-crucible.py` DRIVES, declared in exactly one place
# (CR-CRU-063 §S2/AC8 — never restated in release.yml, which consumes the
# group via `pip install '.[dev]'`).
#
#   coverage               — the pre-merge / regression coverage gate
#                            (CR-CRU-040 §S1); coverage.py is the only
#                            supported coverage path for this client.
#   build                  — the PEP 517 frontend the packaging contracts
#                            build real artifacts with, as
#                            `sys.executable -m build --wheel --no-isolation`
#                            for a wheel, or with no selector for the sdist
#                            and the wheel built from it:
#                            the suite's OWN interpreter, offline, no other
#                            interpreter tried. Fail-fast, never skipped:
#                            `setUpClass` RAISES, naming this extra, when
#                            `importlib.util.find_spec` cannot find `build`,
#                            `hatchling` or `hatch_vcs`, because a silent
#                            skip is how a packaging defect stays invisible.
#                            Named demanders (each `build_modules_gap`):
#                            test_cr046_uv_env_gate.py,
#                            test_crucible_axi_wheel_packaging.py,
#                            test_shipped_limits_ship_as_package_data.py
#                            (three classes — CR-CRU-131 §S1c's travel,
#                            one-datum and version-skew proofs), and
#                            test_the_source_package_ships_only_what_builds_the_wheel.py,
#                            which also builds the sdist and the wheel from
#                            it, as CI's own `python -m build` does.
#   hatchling              — the build backend `[build-system]` names. With
#                            `--no-isolation` no isolated environment
#                            downloads it, so the suite's interpreter carries
#                            it; same demanders and floor as `[build-system]`.
#   hatch-vcs              — the version source plugin `[build-system]` names
#                            (`[tool.hatch.version] source = "vcs"`); carried
#                            here for the same offline build, same demanders.
#   pytest                 — the second runner the python client drives, for
#                            a project declaring `[python] runner = "pytest"`
#                            in its own crucible.toml or a run passing
#                            `--runner pytest`. The client's own suite proves
#                            that path against a real pytest on a committed
#                            fixture project (tests/fixtures/pytest-project),
#                            so the suite's interpreter must import it; a test
#                            that needs it FAILS, never skips, when it is
#                            absent. 9.x is the line the client's pytest
#                            invocation was measured on. Named demander:
#                            test_python_runner_is_declared_by_the_project.py.
#   ruff                   — this project's linter, run on the rule set
#                            `[tool.ruff.lint]` below declares.
dev = ["coverage>=7", "build>=1", "pytest>=9", "ruff>=0.16,<0.17",
       "hatchling>=1.27", "hatch-vcs>=0.4"]

[project.scripts]
crucible-axi = "crucible_axi.cli:main"

[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version", version_scheme = "release-branch-semver" }

# The source package carries only what builds the wheel: the package, the
# client fleet the wheel force-includes, and the changelog. Hatchling adds
# by itself pyproject.toml, the root .gitignore, the declared readme, the
# licence files its default globs match, and the generated PKG-INFO. It walks
# the disk under these paths, honouring only the root .gitignore, so a
# working checkout's untracked files there go in too; a clean one (CI) ships
# exactly the tracked files.
[tool.hatch.build.targets.sdist]
only-include = ["/crucible_axi", "/clients", "/CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["crucible_axi"]

# The client fleet + its status contract + the fleet's own shipped limit
# declarations ship as package data so the installed `crucible-axi`
# orchestrator carries the clients it lays down (S1), and so those clients
# resolve every limit with no git checkout present (CR-CRU-131 §S1c).
#
# The mapping is RECURSIVE and must stay so: `clients/crucible.toml` is the
# fleet's last resort for its LIMITS (it declares no board) and the file
# `[manifest]` copies to `<target-dir>` for the operator to edit, so narrowing
# this to the `*.py` fleet would ship clients with no limits to fall back to.
[tool.hatch.build.targets.wheel.force-include]
"clients" = "crucible_axi/clients"

# What this repo's own coverage gate measures: the orchestrator package and the
# client fleet it ships. Declared here so the python client passes no --source.
[tool.coverage.run]
source = ["crucible_axi", "clients"]

# The project's own ruff rule set, so `ruff check` reads the same rules on any
# machine rather than whatever set the installed ruff defaults to: ruff's
# classic defaults (import, statement and syntax errors, and pyflakes).
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
