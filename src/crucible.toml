# Crucible SERVER limits — PACKAGE DATA. This file is the distribution's own
# last resort, and it ships INSIDE `@anthill-tec/crucible-server` beside the
# resolver that reads it (`src/limits.ts`).
#
# CR-CRU-131 §S1c. A limit is CONFIGURATION, never a constant compiled into
# source (PRD §4.13) — and the last resort is a DATA FILE in the distribution,
# not a number in a resolver. That is what makes "no literal in source"
# achievable rather than aspirational: the file a reader READS and the table
# the code FALLS BACK TO are the same bytes, so they cannot disagree with
# nothing saying so.
#
# ── This is NOT the file you edit ─────────────────────────────────────────
#
# It is package data, replaced wholesale by the next upgrade. The file an
# OPERATOR edits is the `crucible.toml` beside the server's own DATABASE,
# found by the same rule that finds the database (`$CRUCIBLE_DB`, else
# `<cwd>/data/crucible.db`, else the XDG data dir). Add a `value = …` line to
# a limit's table THERE; a value set here would be overwritten on upgrade.
#
# ── Why only the SERVER's three limits are here ───────────────────────────
#
# A limit is owned by the process that ENFORCES it, and the server and the
# clients are not necessarily on the same machine — they are separate
# packages, installable on different hosts at independently resolved versions.
# So this distribution documents the three limits this distribution enforces
# and nothing else. The three CLIENT limits (`truncate_field_chars`,
# `error_detail_chars`, `roadmap_list_rows`) ship in the `crucible-axi`
# distribution and are read from a PROJECT directory; a table for one of them
# written here would be inert, and documentation must not teach a knob that
# provably does nothing where it sits.
#
# Every `recommended` below is the value this server ran at before the limits
# became configuration, so an install with no operator file behaves EXACTLY as
# it did before — the whole safety argument for a configuration change of this
# reach. `min`/`max` are a SUPPORTABILITY judgement, so each states its
# reasoning: a bound nobody can justify is the same defect as a default nobody
# chose.

# ── The LISTENER this server binds (CR-CRU-139 §S1) ──────────────────────
#
# A connection is configuration too. The port and the bind address used to be
# expressible only as `$CRUCIBLE_PORT` / `$CRUCIBLE_HOST` exports, so the only
# record of an operator's decision was a shell history and the failure mode of
# forgetting was silent — a second instance quietly landing on the first one's
# port. Both variables are RETIRED: they are not read at all. Declare the
# listener HERE — in the `crucible.toml` beside the server's own database —
# and an explicit `startServer({ port, hostname })` argument (the in-process
# test seam) is the only thing that outranks the file.

# ── Two settings that are NOT in this file, and cannot be (§S3) ───────────
#
# A reader who has just found `[server] port` here is owed the boundary, or the
# next change "finishes the job" by moving a value that precedes this file's
# own discovery.
#
# `CRUCIBLE_DB` stays in the environment because it is what FINDS this file:
# the operator's copy is the `crucible.toml` beside the database, so the store
# path is answered before any table below it can be read. A `db` line here
# could only ever be read by a process that had already found the file it was
# written in.
#
# `CRUCIBLE_PROJECT_KEY` stays in the environment for the matching reason on
# the CLIENT's side, and is named here only to complete the boundary: it is
# IDENTITY, read from a project's `.env` to say which project a run belongs
# to, before that project's own directory has been resolved to a file. The
# server never reads it — it is told the key on every request.

[server]
# The address this server binds. It stays LOOPBACK unless an operator
# deliberately widens it: the HTTP API is unauthenticated, and `dataPath`
# ingest makes the server READ FILES OFF ITS OWN DISK on a caller's say-so, so
# a board reachable from the network is a file-read primitive handed to it.
# Set `0.0.0.0` only behind something that authenticates, and never by
# accident.
host = "127.0.0.1"
# The port this server listens on. 3849 is the value this project has always
# defaulted to, so an install with no operator file listens exactly where it
# did before — the whole safety argument for moving the setting into a file.
# The installer WRITES the port it chose into the operator's own copy of this
# table, and a port already written there is never re-probed: re-running an
# install must not orphan the clients already pointed at this board.
port = 3849
# The floor of the port range this project may occupy on one machine. The
# range exists because two instances on one workstation — a production board
# and the development board its own work is reported to — is the case this
# project actually runs in, and "pick a free port" is a decision that has to
# be made SOMEWHERE. The installer probes this range, in order, BINDING each
# candidate rather than connecting to it (a socket bound but not listening
# answers no connection and is still taken).
port_range_min = 3800
# The ceiling of that range: a hundred ports in the 3000s, which is as many
# instances of this project as one machine has any business hosting. It is
# read from THIS FILE by the installer rather than carried as a constant in
# it, so an operator who must move the range moves it where it is declared —
# and an install that exhausts the range STOPS and says what occupies it,
# rather than drifting outside the bounds nobody widened.
port_range_max = 3899

[limits.run_abandon_ms]
description = "Milliseconds an OPEN run may live before the sweep settles it as `abandoned`. Raise it when a legitimate suite runs longer than the deadline; lower it to clear ghost runs off the board sooner."
recommended = 1800000
# A one-second deadline abandons every live run, so the floor is more than
# "positive": a minute is shorter than any suite this fleet reports on.
min = 60000
# A day. Past it an open run is not "still going", it is a row nobody will
# ever settle.
max = 86400000

[limits.project_inactive_ms]
description = "Milliseconds of silence after which a project with no live agent reads INACTIVE on the board's project list. Raise it to keep occasional projects visible; lower it to retire finished ones from the default view sooner."
recommended = 3600000
# The default agent TOMBSTONE horizon (`DEFAULT_LIVENESS`, src/types.ts): a
# window shorter than that would call a project inactive while its own agents
# still read as live, which is a verdict the board cannot honour.
min = 300000
# Thirty days, past which "inactive" has stopped distinguishing anything.
max = 2592000000

[limits.retention]
description = "Events kept per project for projects that declare no `retention` of their own. NOTE the documented exception: with NO crucible.toml at all there is NO cap and the boot banner names the uncapped projects — this number applies only once the table exists."
# The value this fleet actually runs at, carried forward from CR-CRU-129's
# close-out rather than invented, so adopting the file changes no cap.
recommended = 5000
# Ten events still leaves one run's own history readable; beneath that a board
# evicts what it has only just ingested.
min = 10
# A million rows for one project is where disk, not usefulness, binds.
max = 1000000
